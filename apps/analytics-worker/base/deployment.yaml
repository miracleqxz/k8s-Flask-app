apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      enableServiceLinks: false
      containers:
      - name: analytics-worker
        image: ghcr.io/miracleqxz/k8s-flask-app:latest
        command:
        - python
        - worker.py
        env:
        - name: RABBITMQ_HOST
          value: rabbitmq.service-checker.svc.cluster.local
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: guest
        - name: RABBITMQ_PASS
          value: guest
        
        - name: POSTGRES_HOST
          value: postgres.service-checker.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: testdb
        
        - name: REDIS_HOST
          value: redis.service-checker.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
        
        
        - name: ELASTICSEARCH_HOST
          value: elasticsearch.service-checker.svc.cluster.local
        - name: ELASTICSEARCH_PORT
          value: "9200"
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi