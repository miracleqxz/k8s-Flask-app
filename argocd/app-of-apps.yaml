apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-checker-apps
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/miracleqxz/k8s-Flask-app.git
    targetRevision: main
    path: argocd/applications
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true