apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: service-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
      - name: consul
        image: hashicorp/consul:1.16
        args:
        - "agent"
        - "-server"
        - "-ui"
        - "-bootstrap-expect=1"
        - "-client=0.0.0.0"
        ports:
        - containerPort: 8500
          name: http
        - containerPort: 8600
          name: dns
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: service-checker
spec:
  type: LoadBalancer
  selector:
    app: consul
  ports:
  - port: 8500
    targetPort: 8500
    name: http
  - port: 8600
    targetPort: 8600
    name: dns
