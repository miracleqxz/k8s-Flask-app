apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: service-checker
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      enableServiceLinks: false

      initContainers:
      - name: wait-for-postgres
        image: postgres:16
        command: 
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h postgres.service-checker.svc.cluster.local -U postgres; do 
            echo "PostgreSQL not ready, waiting..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      - name: wait-for-redis
        image: redis:7-alpine
        command:
        - sh
        - -c
        - |
          echo "Waiting for Redis..."
          until redis-cli -h redis.service-checker.svc.cluster.local ping; do
            echo "Redis not ready, waiting..."
            sleep 2
          done
          echo "Redis is ready!"
      - name: wait-for-elasticsearch
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Elasticsearch..."
          until curl -s http://elasticsearch.service-checker.svc.cluster.local:9200/_cluster/health | grep -q '"status":"green\|yellow"'; do
            echo "Elasticsearch not ready, waiting..."
            sleep 2
          done
          echo "Elasticsearch is ready!"
      
      
      containers:
      - name: flask-app
        image: ghcr.io/miracleqxz/k8s-flask-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: POSTGRES_HOST
          value: "postgres.service-checker.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: REDIS_HOST
          value: "redis.service-checker.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: RABBITMQ_HOST
          value: "rabbitmq.service-checker.svc.cluster.local"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "guest"
        - name: RABBITMQ_PASSWORD
          value: "guest"
        - name: ELASTICSEARCH_HOST
          value: "elasticsearch.service-checker.svc.cluster.local"
        - name: ELASTICSEARCH_PORT
          value: "9200"
        - name: MINIO_HOST
          value: "minio.service-checker.svc.cluster.local"
        - name: MINIO_PORT
          value: "9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin"
        - name: CONSUL_HOST
          value: "consul.service-checker.svc.cluster.local"
        - name: CONSUL_PORT
          value: "8500"
        - name: PROMETHEUS_HOST
          value: "prometheus.service-checker.svc.cluster.local"
        - name: PROMETHEUS_PORT
          value: "9090"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app
  namespace: service-checker
spec:
  type: LoadBalancer
  selector:
    app: flask-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000