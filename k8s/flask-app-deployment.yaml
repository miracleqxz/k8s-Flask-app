apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: service-checker
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: ghcr.io/miracleqxz/k8s-flask-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: ENV
          value: "production"
        - name: APP_POSTGRES_HOST
          value: "postgres.service-checker.svc.cluster.local"
        - name: APP_POSTGRES_PORT
          value: "5432"
        - name: APP_POSTGRES_DB
          value: "postgres"
        - name: APP_POSTGRES_USER
          value: "postgres"
        - name: APP_POSTGRES_PASSWORD
          value: "postgres"
        - name: APP_REDIS_HOST
          value: "redis.service-checker.svc.cluster.local"
        - name: APP_REDIS_PORT
          value: "6379"
        - name: APP_RABBITMQ_HOST
          value: "rabbitmq.service-checker.svc.cluster.local"
        - name: APP_RABBITMQ_PORT
          value: "5672"
        - name: APP_RABBITMQ_USER
          value: "guest"
        - name: APP_RABBITMQ_PASSWORD
          value: "guest"
        - name: APP_ELASTICSEARCH_HOST
          value: "elasticsearch.service-checker.svc.cluster.local"
        - name: APP_ELASTICSEARCH_PORT
          value: "9200"
        - name: APP_MINIO_HOST
          value: "minio.service-checker.svc.cluster.local"
        - name: APP_MINIO_PORT
          value: "9000"
        - name: APP_MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: APP_MINIO_SECRET_KEY
          value: "minioadmin"
        - name: APP_CONSUL_HOST
          value: "consul.service-checker.svc.cluster.local"
        - name: APP_CONSUL_PORT
          value: "8500"
        - name: APP_PROMETHEUS_HOST
          value: "prometheus.service-checker.svc.cluster.local"
        - name: APP_PROMETHEUS_PORT
          value: "9090"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app
  namespace: service-checker
spec:
  type: LoadBalancer
  selector:
    app: flask-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
