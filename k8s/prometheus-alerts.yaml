apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: service-checker
data:
  alerts.yml: |
    groups:
    - name: service-checker-alerts
      interval: 30s
      rules:
      
      # Critical Alerts
      
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          description: "{{ $labels.job }} exporter on {{ $labels.instance }} is DOWN for more than 1 minute!"
          
      - alert: PostgreSQLDown
        expr: pg_up == 0 or up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          description: "PostgreSQL database is DOWN! All database operations will fail."
          
      - alert: RedisDown
        expr: redis_up == 0 or up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          description: "Redis cache is DOWN! Application performance will degrade."
          
      - alert: FlaskAppAllPodsDown
        expr: count(up{job="flask-app"} == 1) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          description: "All Flask application pods are DOWN! Users cannot access the application."
      
      # Warning Alerts
      
      - alert: HighPostgreSQLConnections
        expr: pg_stat_database_numbackends{datname="postgres"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "PostgreSQL has {{ $value }} active connections (threshold: 80)"
          
      - alert: HighRedisMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "Redis memory usage is {{ $value | humanizePercentage }} (threshold: 80%)"
          
      - alert: HighFlaskErrorRate
        expr: rate(flask_request_count_total{http_status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "Flask application error rate is {{ $value | humanizePercentage }}"
          
      - alert: FlaskHighLatency
        expr: histogram_quantile(0.95, rate(flask_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          description: "Flask 95th percentile latency is {{ $value }}s (threshold: 0.5s)"
          
      - alert: LowCacheHitRate
        expr: rate(flask_cache_hits_total[5m]) / (rate(flask_cache_hits_total[5m]) + rate(flask_cache_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 50%)"
